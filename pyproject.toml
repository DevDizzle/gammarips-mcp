[project]
name = "gammarips-mcp"
version = "4.0.0"
description = "GammaRips MCP Server - Agent-first options trading intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.6.1",
    "google-api-python-client>=2.0.0",
    "google-cloud-bigquery>=3.11.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-firestore>=2.11.0",
    "httpx>=0.24.0",
    "pandas-market-calendars>=4.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    # PINNED, and must match the ruff pin in .github/workflows/ci.yml. A range
    # here meant a local `ruff format .` and the CI format gate could disagree
    # about line joining, so a clean local tree still failed CI with no code
    # change. Bump both in one commit, with the resulting reformat in it.
    "ruff==0.15.11",
]

[tool.pytest.ini_options]
# Maintained suites: test_phase2_auth (mocked auth), test_v3_smoke (live V4
# surface + leakage assertions), verify_tools (frozen 9-tool registry guard).
# The dead pre-V3 modules (tests/test_new_tools.py, tests/test_overnight_edge.py,
# tests/manual/*) import tool modules deleted in the V2->V3 migration and have
# been collection-broken since then — ignored here, flagged for removal.
testpaths = ["tests"]
python_files = ["test_*.py", "verify_tools.py"]
addopts = "--ignore=tests/manual --ignore=tests/test_new_tools.py --ignore=tests/test_overnight_edge.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "E402", "E722"]
"src/server.py" = ["E402", "F821", "B904"]  # Closure captures and re-raise patterns
"src/auth/*.py" = ["B904"]
"src/data/*.py" = ["B904"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

