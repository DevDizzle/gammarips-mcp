name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions pinned to majors that are Node.js 24 native (checkout v6, setup-python v6).
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 is kept as a defensive belt-and-suspenders in
# case a future action version regresses; harmless when everything is already Node 24.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      # ruff is PINNED on purpose. It was unpinned, so CI installed whatever
      # ruff had shipped that morning — and the formatter's line-joining
      # behaviour changes between releases. That turns a green main red with no
      # code change and with no way to reproduce it locally, which is how this
      # repo earned commits like 8f1da3e ("style: ruff format (CI gate) — ...
      # caught by newer ruff"). Keep this identical to the `ruff` pin in
      # pyproject.toml [project.optional-dependencies].dev so that a local
      # `ruff format .` produces byte-identical output to this gate.
      # Bumping ruff is a deliberate act: move BOTH pins in one commit and run
      # `ruff format .` in that same commit so the reformat lands with it.
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.15.11 pytest

    - name: Format check with Ruff
      run: |
        ruff format --check .

    - name: Lint with Ruff
      run: |
        ruff check .
